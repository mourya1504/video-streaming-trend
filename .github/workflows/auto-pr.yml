name: Auto PR (branch -> master)

on:
  push:
    branches-ignore:
      - master # CHANGE THIS to your repository's target branch (often main or master).
  workflow_dispatch:
    inputs:
      reviewer:
        description: GitHub username to request as a reviewer (optional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_BRANCH: master # CHANGE THIS to the same target branch listed under branches-ignore above.
          # Set the PR_REVIEWER Actions variable per repository, or pass a reviewer to workflow_dispatch.
          REVIEWER: ${{ github.event.inputs.reviewer || vars.PR_REVIEWER }}
        run: |
          branch="$GITHUB_REF_NAME"
          existing=$(gh pr list --head "$branch" --base "$PR_BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            args=(
              --base "$PR_BASE_BRANCH" \
              --head "$branch" \
              --title "Merge $branch into $PR_BASE_BRANCH" \
              --body-file .github/pull_request_template.md
            )
            if [ -n "$REVIEWER" ]; then
              args+=(--reviewer "$REVIEWER")
            fi
            gh pr create "${args[@]}"
          elif [ -n "$REVIEWER" ]; then
            gh pr edit "$existing" --add-reviewer "$REVIEWER"
          else
            echo "PR #$existing already open; no reviewer configured."
          fi
