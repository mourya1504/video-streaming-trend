# Real-time video-trend detection stack
# Bring up in stages so you're not debugging 6 services at once:
#   docker compose up -d kafka                     -> step 3 (event generator)
#   docker compose up -d kafka jobmanager taskmanager -> step 4 (Flink)
#   docker compose up -d clickhouse                -> step 7 (dashboard queries)
#   docker compose up -d hive-metastore-postgres hive-metastore -> step 5 (schemas)
#   docker compose up -d spark-master spark-worker  -> step 6 (batch layer)
#   docker compose up -d trino                      -> step 7 (federated queries)

services:

  # --- Ingestion: Kafka (KRaft mode, no Zookeeper needed) ---
  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
    depends_on:
      - kafka

  # --- Speed layer: Flink ---
  jobmanager:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    image: flink-pyflink:1.18
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-jobs:/opt/flink-jobs

  taskmanager:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    image: flink-pyflink:1.18
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  # --- Storage for the batch layer: MinIO as an HDFS-compatible object store ---
  # (Swaps in for real HDFS -- avoids YARN setup pain, same S3A connector works from Spark/Hive)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # --- Hive Metastore (schema registry shared by Spark + Presto/Trino) ---
  hive-metastore-postgres:
    image: postgres:15
    container_name: hive-metastore-postgres
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    volumes:
      - hive_pg_data:/var/lib/postgresql/data

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      - hive-metastore-postgres
    ports:
      - "9083:9083"
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive

  # --- Batch layer: Spark ---
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8082:8080"   # Spark master UI (8080 taken by Flink UI's usual port conflict avoided)

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2

  # --- Serving layer: ClickHouse ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9004:9000"   # native client
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # --- Federated query layer: Trino (Presto's actively maintained successor) ---
  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      - hive-metastore
      - clickhouse
    ports:
      - "8083:8080"
    volumes:
      - ./trino-catalog:/etc/trino/catalog

volumes:
  kafka_data:
  minio_data:
  hive_pg_data:
  clickhouse_data: